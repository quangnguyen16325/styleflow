services:
  db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: order-ai-service
    environment:
      AI_STAGE1_MODEL_PATH: /app/ai/saved_model_stage1
      AI_STAGE2_MODEL_PATH: /app/ai/saved_model_stage2
      AI_MODEL_VERSION: stage1_v1_stage2_v1
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order-backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:${FRONTEND_PORT}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: >-
      sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules 2>/dev/null)\" ] ||
      npm install --no-audit --no-fund; npm run dev"

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: order-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules
    command: >-
      sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules 2>/dev/null)\" ] ||
      npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 3000"

  n8n:
    image: n8nio/n8n:2.11.3
    container_name: order-n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - ./n8n_data:/home/node/.n8n
        
volumes:
  db_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  n8n_data:
