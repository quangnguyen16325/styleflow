services:
  db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: order-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order-backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: >-
      sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules 2>/dev/null)\" ] ||
      npm install --no-audit --no-fund; npm run dev"

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: order-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend-web:/app
      - frontend_node_modules:/app/node_modules
    command: >-
      sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules 2>/dev/null)\" ] ||
      npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  db_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
