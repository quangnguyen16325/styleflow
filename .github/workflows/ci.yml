name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env for docker compose validation
        run: |
          cp .env_example .env
          sed -i 's/^POSTGRES_DB=$/POSTGRES_DB=styleflow/' .env
          sed -i 's/^POSTGRES_USER=$/POSTGRES_USER=styleflow_user/' .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=styleflow_pass/' .env
          sed -i 's/^REDIS_PORT=$/REDIS_PORT=6379/' .env
          sed -i 's/^N8N_ENCRYPTION_KEY=$/N8N_ENCRYPTION_KEY=test_n8n_encryption_key_32_chars/' .env
      - run: docker compose --env-file .env config
      - run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config
