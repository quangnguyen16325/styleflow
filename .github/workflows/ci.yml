name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env for docker compose validation
        run: |
          cp .env_example .env
          sed -i 's/^POSTGRES_DB=$/POSTGRES_DB=styleflow/' .env
          sed -i 's/^POSTGRES_USER=$/POSTGRES_USER=styleflow_user/' .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=styleflow_pass/' .env
          sed -i 's/^REDIS_PORT=$/REDIS_PORT=6379/' .env
          sed -i 's/^N8N_ENCRYPTION_KEY=$/N8N_ENCRYPTION_KEY=test_n8n_encryption_key_32_chars/' .env
      - run: docker compose --env-file .env config
      - run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
        run: |
          BRANCH="${DEPLOY_BRANCH:-main}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
            set -e
            cd "${DEPLOY_PATH}"
            git fetch origin
            git checkout "${BRANCH}"
            git pull --ff-only origin "${BRANCH}"
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          EOF
